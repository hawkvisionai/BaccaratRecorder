<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Baccarat Platform Studio v13</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <h1>Baccarat Platform Studio</h1>
        <p>v13 快速輸入版｜牌靴資料即時寫入 Supabase</p>
      </div>
      <button id="logoutButton" class="secondary hidden" type="button">登出</button>
    </header>

    <section id="loginPanel" class="card login-card">
      <h2>管理員登入</h2>
      <label>
        Email
        <input id="emailInput" type="email" autocomplete="username" placeholder="你的管理員 Email" />
      </label>
      <label>
        密碼
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="你的密碼" />
      </label>
      <button id="loginButton" class="primary" type="button">登入</button>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="appPanel" class="hidden">
      <section class="card status-card">
        <div>
          <span class="eyebrow">目前牌靴</span>
          <strong id="shoeNumber">尚未建立</strong>
        </div>
        <div>
          <span class="eyebrow">目前局數</span>
          <strong id="gameCount">0</strong>
        </div>
        <div>
          <span class="eyebrow">同步狀態</span>
          <strong id="syncStatus" class="status pending">準備中</strong>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>快速輸入</h2>
          <span id="shoeState" class="badge">未開始</span>
        </div>

        <div class="point-grid">
          <label>
            莊點數
            <input id="bankerInput" type="number" min="0" max="9" inputmode="numeric" placeholder="0～9" />
          </label>
          <label>
            閒點數
            <input id="playerInput" type="number" min="0" max="9" inputmode="numeric" placeholder="0～9" />
          </label>
        </div>

        <button id="addGameButton" class="primary large" type="button">新增牌局</button>
        <p id="appMessage" class="message"></p>

        <div class="action-grid">
          <button id="undoButton" class="secondary" type="button">刪除上一局</button>
          <button id="finishShoeButton" class="warning" type="button">結束目前牌靴</button>
          <button id="newShoeButton" class="success" type="button">開始新牌靴</button>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>最近 10 局</h2>
          <button id="refreshButton" class="secondary compact" type="button">重新整理</button>
        </div>
        <div id="recentGames" class="recent-list">
          <p class="empty">尚無牌局資料</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
