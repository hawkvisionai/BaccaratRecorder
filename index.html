<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baccarat Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <div><h1>Baccarat Platform</h1><p class="subtitle">v12.0｜新增跨牌靴統計與條件篩選，不代表能預測下一局</p></div>
      <button id="themeButton" class="ghost-button" type="button">切換明暗</button>
    </header>

    <section class="panel shoe-panel">
      <div class="section-title-row">
        <div><h2>目前牌靴</h2><p id="currentShoeInfo" class="hint shoe-info"></p></div>
        <input id="sessionName" class="session-name" type="text" maxlength="40" placeholder="牌靴名稱（選填）">
      </div>
      <div class="button-row three">
        <button id="newShoeButton" class="secondary-button" type="button">開始新牌靴</button>
        <button id="finishShoeButton" class="secondary-button" type="button">結束目前牌靴</button>
        <button id="showShoeHistoryButton" class="secondary-button" type="button">牌靴歷史</button>
      </div>
      <div id="shoeHistoryPanel" class="shoe-history-panel" hidden>
        <div class="section-title-row"><h3>歷史牌靴</h3><button id="closeShoeHistoryButton" class="ghost-button compact-button" type="button">關閉</button></div>
        <div id="shoeHistoryList"></div>
      </div>
    </section>

    <section class="panel analytics-panel">
      <div class="section-title-row">
        <div><h2>跨牌靴統計</h2><p class="hint">彙整多個牌靴的歷史結果與連續走勢</p></div>
        <select id="analyticsScope" class="analytics-control" aria-label="統計範圍">
          <option value="all">全部牌靴</option>
          <option value="10">最近 10 靴</option>
          <option value="50">最近 50 靴</option>
          <option value="100">最近 100 靴</option>
          <option value="500">最近 500 靴</option>
          <option value="1000">最近 1000 靴</option>
        </select>
      </div>
      <div class="analytics-filters">
        <input id="shoeAnalyticsSearch" class="analytics-control" type="search" placeholder="搜尋牌靴編號或名稱">
        <select id="shoeStatusFilter" class="analytics-control" aria-label="牌靴狀態">
          <option value="all">全部狀態</option>
          <option value="open">進行中</option>
          <option value="finished">已結束</option>
        </select>
        <input id="minimumStreakFilter" class="analytics-control" type="number" min="0" max="100" value="0" inputmode="numeric" placeholder="最短連續局數">
        <select id="shoeSort" class="analytics-control" aria-label="排序方式">
          <option value="newest">最新優先</option>
          <option value="oldest">最舊優先</option>
          <option value="gamesDesc">局數多到少</option>
          <option value="bankerRateDesc">莊率高到低</option>
          <option value="playerRateDesc">閒率高到低</option>
        </select>
      </div>
      <p class="hint filter-hint">「最短連續局數」會篩選曾出現同一方連續達指定局數的牌靴。</p>
      <div id="globalStats" class="stat-grid global-stat-grid"></div>
      <canvas id="globalResultChart" width="900" height="320"></canvas>
      <div class="section-title-row analytics-list-title"><h3>牌靴比較</h3><span id="analyticsMatchCount" class="hint"></span></div>
      <div id="shoeAnalyticsList" class="analytics-list"></div>
    </section>

    <section class="panel">
      <div class="section-title-row"><h2>輸入牌局</h2><span class="hint">資料會儲存在目前牌靴</span></div>
      <div class="input-row">
        <div class="input-group"><label for="banker">莊點數</label><input type="number" id="banker" min="0" max="9" inputmode="numeric" placeholder="0～9"></div>
        <div class="input-group"><label for="player">閒點數</label><input type="number" id="player" min="0" max="9" inputmode="numeric" placeholder="0～9"></div>
      </div>
      <button class="primary-button" type="button" id="addButton">新增牌局</button>
      <div class="button-row three">
        <button class="secondary-button" type="button" id="undoButton">刪除上一局</button>
        <button class="secondary-button" type="button" id="redoButton">復原刪除</button>
        <button class="danger-button" type="button" id="clearButton">清除目前牌靴</button>
      </div>
      <p id="message"></p>
    </section>

    <section class="panel" data-feature="stats"><h2>即時統計</h2><div id="stats" class="stat-grid"></div></section>
    <section class="panel" data-feature="recent"><h2>最近區間</h2><div id="recentStats" class="recent-grid"></div></section>
    <section class="panel" data-feature="streaks"><h2>連續走勢</h2><div id="streakStats" class="stat-grid"></div></section>

    <section class="panel" data-feature="bead"><div class="section-title-row"><h2>珠盤路</h2><span class="hint">每欄由上往下 6 格</span></div><div class="road-scroll"><div id="beadRoad" class="road bead-road"></div></div></section>
    <section class="panel" data-feature="bigroad"><div class="section-title-row"><h2>大路</h2><span class="hint">和局附加在前一個莊／閒結果上</span></div><div class="road-scroll"><div id="bigRoad" class="road grid-road"></div></div></section>
    <section class="panel" data-feature="derived"><h2>衍生路</h2><h3>大眼仔</h3><div class="road-scroll"><div id="bigEyeRoad" class="road mini-road"></div></div><h3>小路</h3><div class="road-scroll"><div id="smallRoad" class="road mini-road"></div></div><h3>曱甴路</h3><div class="road-scroll"><div id="cockroachRoad" class="road mini-road"></div></div></section>
    <section class="panel" data-feature="difference"><h2>點數差值分析</h2><div id="differenceStats" class="difference-grid"></div></section>
    <section class="panel" data-feature="charts"><h2>圖表</h2><canvas id="resultChart" width="900" height="320"></canvas><canvas id="differenceChart" width="900" height="320"></canvas></section>

    <section class="panel" data-feature="transfer"><h2>資料匯入與匯出</h2><div class="button-row"><button id="exportCsvButton" class="secondary-button" type="button">匯出目前牌靴 CSV</button><label class="file-button">匯入 CSV 到目前牌靴<input id="importCsvInput" type="file" accept=".csv,text/csv"></label></div><div class="button-row"><button id="exportAllCsvButton" class="secondary-button" type="button">匯出全部牌靴 CSV</button><button id="exportJsonButton" class="secondary-button" type="button">備份全部 JSON</button><label class="file-button">還原全部 JSON<input id="importJsonInput" type="file" accept=".json,application/json"></label></div></section>

    <section class="panel"><div class="section-title-row"><h2>牌局紀錄</h2><input id="historySearch" class="history-search" type="search" placeholder="搜尋局數、莊、閒、和或點數"></div><div id="history"></div></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
